<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4a843" />
      <stop offset="100%" stop-color="#a87c1f" />
    </linearGradient>
    <radialGradient id="logo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c870" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06061a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sanctuary Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#logo-glow)"/>

  <!-- Outer Ring with Subtle Dots/Dashes -->
  <circle cx="32" cy="32" r="26" stroke="url(#logo-gold)" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="21" stroke="url(#logo-gold)" stroke-width="1.8" stroke-opacity="0.9"/>

  <!-- Cardinal Nexus Marks -->
  <line x1="32" y1="4" x2="32" y2="8" stroke="url(#logo-gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="56" x2="32" y2="60" stroke="url(#logo-gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="8" y2="32" stroke="url(#logo-gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="32" x2="60" y2="32" stroke="url(#logo-gold)" stroke-width="2" stroke-linecap="round"/>

  <!-- Radiant Nexus Flare -->
  <path d="M 32 15 Q 32 32 49 32 Q 32 32 32 49 Q 32 32 15 32 Q 32 32 32 15 Z" fill="url(#logo-gold)"/>

  <!-- Center Sanctuary Light -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>
