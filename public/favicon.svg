<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4a843" />
      <stop offset="100%" stop-color="#a87c1f" />
    </linearGradient>
    <radialGradient id="gold-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c870" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06061a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background base rounded -->
  <rect width="64" height="64" rx="14" fill="#06061a"/>
  
  <!-- Subtle Sanctuary Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#gold-glow)"/>

  <!-- Outer Sanctuary Ring -->
  <circle cx="32" cy="32" r="23" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="19" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Cross-Cardinal Nexus ticks -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="58" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="32" x2="10" y2="32" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="58" y2="32" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Core Radiant Star / Cross Nexus (Impact) -->
  <path d="M 32 17 Q 32 32 47 32 Q 32 32 32 47 Q 32 32 17 32 Q 32 32 32 17 Z" fill="url(#gold-grad)"/>

  <!-- Core Center Point -->
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
</svg>
