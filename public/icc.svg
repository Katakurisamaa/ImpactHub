<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A671D" />
    </linearGradient>

    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0E8E5" />
      <stop offset="100%" stop-color="#224E54" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="#06121D" />

  <g fill="#FFE082">
    <circle cx="150" cy="150" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" /></circle>
    <circle cx="650" cy="200" r="3"><animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="200" cy="600" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="600" cy="650" r="2"><animate attributeName="opacity" values="0;0.7;0" dur="5s" repeatCount="indefinite" begin="2s"/></circle>
  </g>

  <g fill="none" stroke-width="4" filter="url(#glow)">
    
    <g>
      <ellipse cx="400" cy="400" rx="300" ry="80" stroke="url(#tealGradient)" opacity="0.6" />
      <circle cx="100" cy="400" r="6" fill="#A0E8E5" /> <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="20s" repeatCount="indefinite" />
    </g>

    <g>
      <ellipse cx="400" cy="400" rx="280" ry="90" stroke="url(#tealGradient)" opacity="0.7" />
      <circle cx="400" cy="310" r="5" fill="#FFE082" /> <animateTransform attributeName="transform" type="rotate" from="120 400 400" to="480 400 400" dur="25s" repeatCount="indefinite" />
    </g>

    <g>
      <ellipse cx="400" cy="400" rx="260" ry="100" stroke="url(#tealGradient)" opacity="0.5" />
      <circle cx="660" cy="400" r="4" fill="#A0E8E5" /> <animateTransform attributeName="transform" type="rotate" from="240 400 400" to="600 400 400" dur="18s" repeatCount="indefinite" />
    </g>
  </g>

  <g filter="url(#glow)" transform-origin="400 400">
    <animateTransform attributeName="transform" type="scale" values="0.95; 1.05; 0.95" dur="4s" repeatCount="indefinite" />
    
    <circle cx="400" cy="400" r="60" fill="url(#goldGradient)" />
    
    <circle cx="400" cy="400" r="45" fill="#FFF" opacity="0.2">
      <animate attributeName="opacity" values="0.1; 0.5; 0.1" dur="2s" repeatCount="indefinite" />
    </circle>

    <circle cx="400" cy="400" r="75" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="5 10">
      <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="-360 400 400" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <g stroke="#A0E8E5" stroke-width="1" opacity="0">
    <line x1="400" y1="400" x2="600" y2="200">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="400" y1="400" x2="200" y2="600">
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite" begin="1.5s" />
    </line>
  </g>
</svg>
